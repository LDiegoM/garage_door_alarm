<div class="container mt-4">
    <p>This page contains current WiFi configurations, and allows to modify them.</p>
    <p>Current WiFi APs (update if necessary)</p>
<!--{wifi_update_ap.html}-->
</div>
<div class="container mt-4">
    <p>New WiFi AP (complete to add new)</p>
    <div class="row">
        <div class="col">
            <input type="text" class="form-control" id="ap" placeholder="AP ssid" name="ap">
        </div>
        <div class="col">
            <input type="password" class="form-control" id="pw" placeholder="Password" name="pw">
        </div>
    </div>
</div>
<div class="container mt-2">
    <div class="row">
        <div class="col">
            <button type="submit" class="btn btn-primary" onclick="saveWiFi();">Save</button>
        </div>
    </div>
</div>
<script>
function delAP(ap) {
    if (ap != "") {
        call("/settings/wifi?ap=" + ap, "DELETE").then((o) => {
            if (o == true) {
                document.location.reload(true);
            }
        });
    }
}

async function updAPs() {
    const a = document.getElementsByClassName('upd-ap');
    const aps = [...a].map(input => input.value);
    const p = document.getElementsByClassName('upd-pw');
    const pws = [...p].map(input => input.value);
    const b = getUpdBody(aps, pws);

    var o = false;
    if (b != '{"aps":[]}') {
        o = await call("/settings/wifi", "PUT", b);
    }
    return o;
}

function getUpdBody(aps, pws) {
    var s = '{"aps":[';
    var a = 0;
    for (var i = 0; i < aps.length; i++) {
        if (pws[i] != "****") {
            if (a > 0) {
                s += ",";
            }
            a++;
            s += '{"ap":"' + aps[i] + '", "pw":"' + pws[i] + '"}';
        }
    }
    s += "]}";
    return s;
}

async function addAP() {
    const a = document.getElementById("ap").value;
    const p = document.getElementById("pw").value;
    var o = false;
    if (ap != "") {
        const b = '{"ap":"' + a + '","pw":"' + p + '"}';
        o = await call("/settings/wifi", "POST", b);
    }
    return o;
}

function saveWiFi() {
    var okUpd = false;
    var okAdd = false;
    updAPs().then((uo) => {
        okUpd = uo;
        addAP().then((ao) => {
            okAdd = ao;

            if (okUpd == true || okAdd == true) {
                document.location.reload(true);
            }
        });
    });
}
</script>
