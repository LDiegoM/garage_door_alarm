<!-- Messages Modal -->
<div class="modal fade" id="message"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header">
        <h4 class="modal-title" id="messageHeader"></h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" onclick="closeModal();"></button>
    </div>

    <div class="modal-body"><p id="messageBody"></p></div>

    <div class="modal-footer">
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal" onclick="closeModal();">Close</button>
    </div>
</div></div></div>
<script>
var mm = new bootstrap.Modal(document.getElementById('message'));
function openModal(title, body) {
    document.getElementById('messageHeader').innerHTML = title;
    document.getElementById('messageBody').innerHTML = body;

    mm.show();
}
function closeModal() {
    mm.hide();
}
async function call(p, m, b) {
    var ok=false;
    const rsp = await fetch(
        p,
        {
            method: m,
            headers: {
                'Content-Type': 'application/json'
            },
            body: b
        }
    )

    if (rsp.status >= 200 && rsp.status <= 299) {
        ok = true;
    } else if (rsp.status >= 400) {
        const m = await rsp.text();
        openModal("error", m);
    }
    return ok;
}
</script>
